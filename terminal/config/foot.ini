# foot terminali - berkeDark
# Active font (the Nerd Font variant has the icons built in; the others take them from Symbols Nerd Font Mono).
font=JetBrainsMono Nerd Font:size=18
# font=RobotoMono Nerd Font:size=12   (tried 2026-10-31; the user kept JetBrains for the terminal, RobotoMono stays in the bar)
# Alternatives: uncomment one and comment out the line above.
# font=Iosevka:size=12, Symbols Nerd Font Mono:size=12
# font=Fira Mono:size=12, Symbols Nerd Font Mono:size=12
# font=Source Code Pro:size=12, Symbols Nerd Font Mono:size=12
# font=IBM Plex Mono:size=12, Symbols Nerd Font Mono:size=12
pad=8x6
# bold text uses the bright palette color (bold cream -> white), like the Linux console
bold-text-in-bright=palette-based
# every shell runs inside berkeDark's colour interpreter; without the program the shell starts plainly
shell=/bin/sh -c '[ -x "$HOME/.local/bin/berkeDark" ] && exec "$HOME/.local/bin/berkeDark" /bin/zsh; exec /bin/zsh'

[scrollback]
lines=10000

[colors-dark]
background=070f1f
foreground=ffe8c2
regular0=070f1f
regular1=ff4455
regular2=a9ec76
regular3=ffd25c
regular4=3f7fff
regular5=a3a5f5
regular6=12ab7f
regular7=ffe8c2
bright0=6e7380
bright1=ff5c7c
bright2=3fff7f
bright3=ffff00
bright4=57bfff
bright5=ff00ff
bright6=6fdcf0
bright7=fafcff
selection-background=252261
selection-foreground=fafcff
# cursor: text color, cursor color (berkeDark orange)
cursor=070f1f ff9e60

[cursor]
# hollow box like VS Code, blinking
style=hollow
blink=yes

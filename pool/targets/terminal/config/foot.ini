# foot terminal - berkeDark: its colours, its cursor and its colour interpreter, nothing else.
# berkeDark's installer writes this file as ~/.config/foot/berkeDark.ini and includes it at the end of your
# foot.ini; your own settings there (font, pad, scrollback and the rest) stay as they are.
# bold text uses the bright palette color (bold cream -> white), like the Linux console
bold-text-in-bright=palette-based
# every shell runs inside berkeDark's colour interpreter; without the program the shell starts plainly.
# The installer puts your own shell in the two places marked (foot.ini's shell=, else $SHELL, else /bin/sh).
shell=/bin/sh -c '[ -x "$HOME/.local/bin/berkeDark" ] && exec "$HOME/.local/bin/berkeDark" @SHELL@; exec @SHELL@'

[colors-dark]
background=@{bg:base.background}
foreground=@{base.text}
regular0=@{ansi.black}
regular1=@{ansi.red}
regular2=@{ansi.green}
regular3=@{ansi.yellow}
regular4=@{ansi.blue}
regular5=@{ansi.magenta}
regular6=@{ansi.cyan}
regular7=@{ansi.white}
bright0=@{ansi.bright-black}
bright1=@{ansi.bright-red}
bright2=@{ansi.bright-green}
bright3=@{ansi.bright-yellow}
bright4=@{ansi.bright-blue}
bright5=@{ansi.bright-magenta}
bright6=@{ansi.bright-cyan}
bright7=@{ansi.bright-white}
selection-background=@{bg:base.selection}
selection-foreground=@{=white}
# cursor: text color, cursor color (berkeDark orange)
cursor=@{bg:base.background} @{base.cursor}

[cursor]
# hollow box like VS Code, blinking
style=hollow
blink=yes
